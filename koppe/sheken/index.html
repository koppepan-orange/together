<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>debug-room!!</title>
    <link rel="stylesheet" href="mitame.css"/>
  </head>
  <body>
    <div id="movableDescription"></div>
    <div id="log">
      <div class="opener"></div>
      <div class="log"></div>
    </div>
    <div id="text"></div>

    <div id="titleArea">
      <div class="title">夜を借りて</div>
      <div class="buttons">
        <div class="bt new">ニューゲーム</div>
        <div class="bt load">ロードゲーム</div>
      </div>
    </div>

    <div id="mainArea">

      <div id="save"></div>

      <div id="battle">
        <div class="turn"></div>
        <div class="column">
          <div class="enemies"></div>
          <div class="players"></div>
        </div>
        <div class="commands"></div>
      </div>

    </div>


    <script src="data.js" defer></script>
    <script src="battle.js" defer></script>
    <script src="nakami.js" defer></script>
  </body>
  </html>
