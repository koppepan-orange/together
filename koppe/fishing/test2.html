<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Dominant Color (JS only)</title>
    <style>
        body{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; padding:20px}
        #swatch{width:120px;height:120px;border:1px solid #222;display:inline-block;vertical-align:middle}
        #info{display:inline-block;vertical-align:middle;margin-left:16px}
        canvas{display:none}
    </style>
</head>
<body>
    <input id="file" type="file" accept="image/*">
    <div id="result" style="margin-top:16px">
        <div id="swatch"></div>
        <div id="info"><div id="hex"></div><div id="rgb"></div></div>
    </div>
    <canvas id="c"></canvas>

    <script>
        let fileInput = document.getElementById('file');
        let swatch = document.getElementById('swatch');
        let hexEl = document.getElementById('hex');
        let canvas = document.getElementById('c');
        let ctx = canvas.getContext('2d');

        fileInput.addEventListener('change',function(e){
            let f = e.target.files[0];
            if(!f) return;
            let url = URL.createObjectURL(f);
            let img = new Image();
            img.crossOrigin = 'Anonymous';
            img.onload = function(){
                let maxSide = 200;
                let w = img.width;
                let h = img.height;
                let scale = Math.min(1, maxSide / Math.max(w,h));
                canvas.width = Math.round(w * scale);
                canvas.height = Math.round(h * scale);
                ctx.clearRect(0,0,canvas.width,canvas.height);
                ctx.drawImage(img,0,0,canvas.width,canvas.height);
                let data = ctx.getImageData(0,0,canvas.width,canvas.height).data;
                let color = extractDominantColor(data, canvas.width, canvas.height);
                swatch.style.backgroundColor = color;
                hexEl.textContent = color;
                URL.revokeObjectURL(url);
            };
            img.src = url;
        });

        // data: Uint8ClampedArray (rgba列), w/h: canvasサイズ
        function extractDominantColor(data,w,h){
            // shift: チャンネルごとの量子化ビット数（大きいほど荒い分類、速い）
            let shift = 4; // 4 -> 16階調 (16^3 = 4096 ビン)
            let counts = {};      // key(hexbin) -> count
            let totals = {};      // key -> [rSum,gSum,bSum]
            let len = w * h;
            // サンプリング間隔。1に近いほど正確で遅い。大きくして高速化可能
            let pixelStep = 4 * 3; // 3ピクセルごとにサンプル
            for(let i = 0; i < data.length; i += pixelStep){
                let a = data[i+3];
                if(a == 0) continue; // 完全透明は無視
                let r = data[i];
                let g = data[i+1];
                let b = data[i+2];
                let key = ((r >> shift) << 16) | ((g >> shift) << 8) | (b >> shift);
                let k = key.toString(16);
                if(counts[k] == null){ counts[k] = 0; totals[k] = [0,0,0]; }
                counts[k] += 1;
                totals[k][0] += r;
                totals[k][1] += g;
                totals[k][2] += b;
            }
            let maxCount = 0;
            let maxKey = null;
            for(let k in counts){
                if(counts[k] > maxCount){
                    maxCount = counts[k];
                    maxKey = k;
                }
            }
            if(maxKey == null) return {hex:'#000000', r:0, g:0, b:0};
            let avgR = Math.round(totals[maxKey][0] / counts[maxKey]);
            let avgG = Math.round(totals[maxKey][1] / counts[maxKey]);
            let avgB = Math.round(totals[maxKey][2] / counts[maxKey]);

            // let hex = '#' + ((1 << 24) + (avgR << 16) + (avgG << 8) + avgB).toString(16).slice(1);
            let hex = `#${((1 << 24)+(avgR << 16)+(avgG << 8)+avgB).toString(16).slice(1)}`;
            return hex;
        }
    </script>
</body>
</html>
