<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>terminal-demo</title>
    <style>
        html,body{
            height:100%;
            margin:0;
            background:#000;
            color:#00ff41;
            font-family: "Courier New", monospace;
            overflow:hidden;
        }
        #screen{
            padding:24px;
            white-space:pre-wrap;
            font-size:16px;
            line-height:1.4;
        }
        .cursor{
            display:inline-block;
            width:8px;
            height:18px;
            background:#00ff41;
            margin-left:6px;
            animation:blink 0.7s steps(1) infinite;
            vertical-align:bottom;
        }
        @keyframes blink{
            50%{opacity:0}
        }
        #progress{
            width:80%;
            height:12px;
            border:1px solid #004400;
            margin-top:18px;
            background:rgba(0,0,0,0.6);
        }
        #bar{
            height:100%;
            width:0%;
            background:linear-gradient(90deg,#003300,#00ff41);
            transition:width 0.6s linear;
        }
    </style>
</head>
<body>
    <div id="screen"></div>
    <div id="progress"><div id="bar"></div></div>
    <script>
        let lines = [
            "INITIALIZING...",
            "LOADING DRIVER: /dev/usb/0",
            "SCANNING: C:\\Users\\Alice\\Documents",
            "FOUND 132 suspicious files",
            "ISOLATING..."
        ];
        let screen = document.getElementById('screen');
        let bar = document.getElementById('bar');
        let i = 0;
        function typeLine(){
            if(i >= lines.length) return;
            let text = lines[i];
            let j = 0;
            let id = setInterval(function(){
                if(j >= text.length){
                    clearInterval(id);
                    screen.appendChild(document.createElement('br'));
                    i++;
                    let pct = Math.min(100, i * 20);
                    bar.style.width = pct + '%';
                    setTimeout(typeLine, 500);
                    return;
                }
                screen.textContent += text[j];
                j++;
            }, 35);
        }
        typeLine();
    </script>
</body>
</html>
